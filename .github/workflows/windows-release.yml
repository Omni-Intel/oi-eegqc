name: Windows release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build zip and installer
        run: powershell -ExecutionPolicy Bypass -File scripts/build-desktop.ps1
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            dist/OI-EEGQC-Windows-x64.zip
            dist/OI-EEGQC-Setup-Windows-x64.exe
          if-no-files-found: error
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          $files = @(
            "dist/OI-EEGQC-Windows-x64.zip",
            "dist/OI-EEGQC-Setup-Windows-x64.exe"
          )
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @files --clobber
          } else {
            gh release create $tag @files --generate-notes --title $tag
          }
