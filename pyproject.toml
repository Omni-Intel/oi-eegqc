[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oi-eegqc"
version = "0.6.19"
description = "Local EEG quality scoring and resumable collection uploads for the desktop."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "pentaoa" }]
keywords = ["EEG", "quality-control", "QA", "QC", "ODQ", "GQI", "BIDS"]
dependencies = [
  "numpy>=1.23",
  "scipy>=1.9",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
mne = ["mne>=1.5"]
dev = ["pytest>=7.0"]
desktop = ["PySide6>=6.8,<7", "mne>=1.5"]
packaging = ["pyinstaller>=6.12,<7"]
server = ["tos>=2.9,<3"]
s3-server = ["boto3>=1.36,<2"]
s3-test = ["boto3>=1.36,<2", "moto[s3,server]>=5,<6"]

[project.scripts]
oi-eegqc = "oi_eegqc.cli:main"
oi-eegqc-upload-signer = "oi_eegqc.upload_signer.app:main"

[project.gui-scripts]
oi-eegqc-desktop = "oi_eegqc.desktop:main"

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["oi_eegqc.legacy*"]

[tool.setuptools.package-data]
oi_eegqc = ["py.typed", "qml/*.qml", "layouts/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
