[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oi-eegqc"
version = "0.4.1"
description = "Adaptive EEG quality control bench for clean commercial multi-duration, multi-montage intake."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "pentaoa" }]
keywords = ["EEG", "quality-control", "QA", "QC", "ODQ", "GQI", "BIDS"]
dependencies = [
  "numpy>=1.23",
  "scipy>=1.9",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
mne = ["mne>=1.5"]
dev = ["pytest>=7.0"]
desktop = ["PySide6>=6.8,<7", "mne>=1.5"]
packaging = ["pyinstaller>=6.12,<7"]

[project.scripts]
oi-eegqc = "oi_eegqc.cli:main"

[project.gui-scripts]
oi-eegqc-desktop = "oi_eegqc.desktop:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
oi_eegqc = ["py.typed", "qml/*.qml", "layouts/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
