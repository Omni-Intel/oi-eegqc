layout_schema: oi-eegqc-layout-v1
id: emotiv_flex_2
sdk: emotiv
sdk_version: "0.2.4"
n_channels: 32
device_aliases:
  - emotiv
  - emotiv flex 2
  - flex 2
  - flex2
  - f3000441
source: >
  Emotiv Flex 2 32-channel montage streamed through Cortex
  (wss://127.0.0.1:6868, 256 Hz), channel order as reported by the EEG stream.
notes: >
  Flex 2 exposes 32 EEG channels with Emotiv's own 10-20 style labels (AF3/AF4,
  F7/F8, P7/P8 ...). No dedicated EOG channel is streamed, so every channel is
  scored as EEG; head-movement artefacts are expected on the fronto-polar rows.
